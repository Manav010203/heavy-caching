version: '3.8'
services:
    redis:
      image: redis:7-alpine
      container_name : Redis-News-aggreagator
      ports:
        - '6379:6379'
      volumes:
        - redis-data:/data
      command: ["redis-server", "--save", "60", "1"]
      restart: always

    postgres:
      image: postgres:16
      container_name: Postgres-news-aggreagator
      environment:
        POSTGRES_USER:  postgres
        POSTGRES_PASSWORD: mysecretpassword
        POSTGRES_DB: mydb
      ports:
       - '5432:5432'
      volumes:
       - postgres-data:/var/lib/postgresql/data
      restart: always



volumes:
  redis-data:
  postgres-data: